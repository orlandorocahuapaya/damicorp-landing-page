<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Logo DAMICOR</title>
  <desc id="desc">DAMICOR Centro de Arbitraje Emergente Internacional</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3559"/>
      <stop offset="100%" stop-color="#2f5a9e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d1a2d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g transform="translate(48,42)" filter="url(#softShadow)">
    <circle cx="118" cy="118" r="106" fill="#ffffff" fill-opacity="0.11"/>
    <circle cx="118" cy="118" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>

    <line x1="118" y1="52" x2="118" y2="170" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="84" x2="156" y2="84" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <path d="M85 84 L63 126 H107 Z" fill="#ffffff" fill-opacity="0.92"/>
    <path d="M151 84 L129 126 H173 Z" fill="#ffffff" fill-opacity="0.92"/>
    <rect x="90" y="172" width="56" height="8" rx="4" fill="#ffffff"/>
    <rect x="76" y="184" width="84" height="8" rx="4" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <g transform="translate(292,0)" fill="#ffffff">
    <text x="0" y="142" font-family="Taviraj, 'Times New Roman', serif" font-size="86" font-weight="700" letter-spacing="4">
