    </text>
    <text x="0" y="198" font-family="Taviraj, 'Times New Roman', serif" font-size="36" font-weight="500" letter-spacing="2.2">
      CENTRO DE ARBITRAJE EMERGENTE
    </text>
    <text x="0" y="242" font-family="Taviraj, 'Times New Roman', serif" font-size="36" font-weight="500" letter-spacing="2.2">
      INTERNACIONAL
    </text>
  </g>
